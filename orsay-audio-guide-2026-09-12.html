const cache = {};
let cur = null;
document.querySelectorAll('button.play').forEach(function(b){ b.dataset.t = b.textContent; });
function get(k){ if(!cache[k]) cache[k] = new Audio('data:audio/mp3;base64,' + AUDIO_DATA[k]); return cache[k]; }
function play(k, btn){
  stopAll();
  cur = get(k);
  cur.play();
  btn.textContent = '▶ 播放中…';
  cur.onended = function(){ btn.textContent = btn.dataset.t; cur = null; };
}
function stopAll(){ if(cur){ cur.pause(); cur.currentTime = 0; cur = null; }
  document.querySelectorAll('button.play').forEach(function(b){ b.textContent = b.dataset.t; }); }
</script>
